<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kinetix sprites in PixiJS</title>
    <link rel="stylesheet" href="./starter.css">
  </head>
  <body>
    <main>
      <h1>Kinetix sprites in PixiJS</h1>
      <div class="controls">
        <label>Portable sprite ZIP <input id="bundle" type="file" accept=".zip,application/zip" disabled></label>
        <label>Clip and direction <select id="clip" disabled></select></label>
        <button id="transport" type="button" disabled>Pause</button>
      </div>
      <p id="message" role="status">Starting the PixiJS renderer.</p>
      <section id="plan" aria-labelledby="plan-title" hidden>
        <h2 id="plan-title">Import preview</h2>
        <ul id="changes"></ul>
        <button id="apply" type="button">Apply import</button>
        <button id="cancel" type="button">Cancel</button>
      </section>
      <div id="game" aria-label="PixiJS sprite preview"></div>
      <dl>
        <dt>Last cue</dt><dd id="cue">None</dd>
        <dt>Project revision</dt><dd id="revision">None</dd>
      </dl>
    </main>
    <script type="module" src="./starter.ts"></script>
  </body>
</html>
