<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="96" viewBox="10 20 100 80">
  <title>Layered lantern</title>
  <defs>
    <style>.badge { fill: #224466; } #Badge { fill-rule: nonzero; } .spark { fill: currentColor; }</style>
    <linearGradient id="stops">
      <stop offset="0" stop-color="white" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#ff7b29"/>
    </linearGradient>
    <linearGradient id="glow" xlink:href="#stops" gradientUnits="userSpaceOnUse" x1="12" y1="0" x2="66" y2="0"/>
    <clipPath id="Slit"><rect x="12" y="12" width="54" height="14"/></clipPath>
    <circle id="Dot" cx="0" cy="0" r="3"/>
  </defs>
  <g id="Lantern" transform="translate(10 20)">
    <path id="Badge" class="badge" d="M10 12 H70 V70 H10 Z M28 27 V53 H52 V27 Z"/>
    <g id="Highlights" clip-path="url(#Slit)">
      <rect id="Glow" x="0" y="5" width="90" height="32" rx="3" fill="url(#glow)"/>
    </g>
    <path id="Curve" d="M75 20 q6 -10 12 0 t12 0" fill="none" stroke="rgba(20,145,178,0.6)" stroke-width="2" stroke-linecap="round"/>
    <use id="Spark" xlink:href="#Dot" x="85" y="51" class="spark" color="#d61b55"/>
    <text id="Caption" x="80" y="77">Glow</text>
  </g>
</svg>
